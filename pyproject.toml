[project]
name = "bits-assignments"
version = "0.1.0"
description = "BITS Assignments Repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.16.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
